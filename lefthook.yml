pre-commit:
  parallel: true
  jobs:
    - name: lint
      glob: '*.{js,ts,tsx,mjs,cjs}'
      exclude:
        - 'node_modules/**'
        - 'dist/**'
        - 'playground/**'
      run: pnpm eslint --fix -- {staged_files} && git add {staged_files}

    - name: typecheck
      glob: '*.{ts,tsx}'
      exclude:
        - 'node_modules/**'
        - 'dist/**'
        - 'playground/**'
      run: pnpm typecheck

pre-push:
  parallel: true
  jobs:
    - name: test
      run: pnpm test
